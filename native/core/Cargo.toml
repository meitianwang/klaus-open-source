[package]
name = "klaus-native-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
credential-fixtures = []
ssh-fixtures = ["dep:rand"]
whatsapp-fixtures = ["wacore-noise/klaus-fixture-root", "dep:rand", "dep:prost", "dep:fixture-hmac", "dep:fixture-sha2"]

[[bin]]
name = "klaus-ssh-fixture"
path = "src/ssh/fixture_main.rs"
required-features = ["ssh-fixtures"]

[dependencies]
ignore = "0.4"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
russh = { version = "0.62.7", default-features = false, features = ["flate2", "ring", "rsa"] }
glob = "0.3"
base64 = "0.22"
sha2 = "0.11"
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.13"
hmac = "0.13"
zeroize = "1"
rand = { version = "0.10", optional = true }
sha1 = "0.11"
chrono = "0.4"
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.6.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-websockets = { version = "=0.13.3", features = ["client", "server", "getrandom", "ring", "rustls-bring-your-own-connector"] }
whatsapp-rust = { version = "=0.5.0", default-features = false, features = ["tokio-runtime"] }
whatsapp-rust-sqlite-storage = "=0.5.0"
wacore = { version = "=0.5.0", default-features = false }
wacore-binary = { version = "=0.5.0", default-features = false }
waproto = "=0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.8.1"

[dev-dependencies]
tempfile = "3"
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dependencies.wacore-noise]
version = "=0.5.0"
default-features = false

[[bin]]
name = "klaus-whatsapp-fixture"
path = "src/whatsapp/fixture_main.rs"
required-features = ["whatsapp-fixtures"]

[dependencies.prost]
version = "0.14"
optional = true

[dependencies.fixture-hmac]
package = "hmac"
version = "0.12"
optional = true

[dependencies.fixture-sha2]
package = "sha2"
version = "0.10"
optional = true
