[package]
name = "klaus-browser-import-windows"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "klaus-browser-import-windows"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

[workspace]
