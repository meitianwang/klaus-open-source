[package]
name = "klaus-node"
version.workspace = true
edition.workspace = true
publish = false

[features]
credential-fixtures = ["klaus-native-core/credential-fixtures"]
whatsapp-fixtures = ["klaus-native-core/whatsapp-fixtures"]

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[build-dependencies]
napi-build = "2"

[dependencies]
klaus-native-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi9", "async", "compat-mode"] }
napi-derive = "3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
